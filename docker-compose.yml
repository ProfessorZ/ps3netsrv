services:
  ps3netsrv:
    build:
      context: .
      args:
        # Shown in the startup banner.
        BUILD_DATE: "${BUILD_DATE:-unknown}"
    image: ps3netsrv:latest
    container_name: ps3netsrv
    restart: unless-stopped

    # ps3netsrv only ever needs to read the media it shares.
    volumes:
      - ./games:/games:ro

    ports:
      - "38008:38008/tcp"

    # netiso is a strictly request/response protocol -- the console blocks on
    # every reply -- so it is round-trip bound, and the bridge network's extra
    # veth + NAT hop is paid once per request. Measured locally at ~1.8x more
    # throughput and roughly half the per-request latency on host networking.
    # Neither figure is anywhere near a bottleneck for a console that needs
    # ~9 MB/s, so treat this as headroom rather than a fix. To use it, comment
    # out the `ports:` block above and uncomment:
    # network_mode: host

    environment:
      PS3NETSRV_ROOT: /games
      PS3NETSRV_PORT: "38008"
      # Restrict which consoles may connect, e.g. "192.168.1.*".
      # PS3NETSRV_WHITELIST: "192.168.1.*"

    # Match this to the owner of ./games on the host. The image defaults to
    # 1000:1000; set it explicitly if your media is owned by anyone else.
    user: "1000:1000"

    # The server never needs to gain privileges once it has bound its port.
    security_opt:
      - no-new-privileges:true
