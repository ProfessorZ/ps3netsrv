# Builds and publishes the ps3netsrv application image.
name: Build and Push ps3netsrv Image

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.dockerignore'
      - 'src/**'
      - 'include/**'
      - 'Makefile.linux'
      - '.github/workflows/docker-app.yml'
  pull_request:
    branches: [ "master", "main" ]
    # Kept in step with the push filter above: a PR that touches none of these
    # cannot change the image, so there is nothing to verify.
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.dockerignore'
      - 'src/**'
      - 'include/**'
      - 'Makefile.linux'
      - '.github/workflows/docker-app.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Pull requests only prove the image still builds. Kept as a separate job so
  # it runs with a token that has no package permissions at all: the build
  # executes the Dockerfile from the PR's branch, and that should never happen
  # while holding a credential that can write to the registry.
  verify:
    name: Verify image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build and push image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase repository names, so the owner cannot be
      # interpolated as-is: on a fork whose owner has capitals the push fails
      # with "repository name must be lowercase". Lowercasing here keeps the
      # workflow correct for any fork without hardcoding an owner.
      - name: Compute image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/$owner/ps3netsrv" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build date
        id: date
        run: echo "value=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
